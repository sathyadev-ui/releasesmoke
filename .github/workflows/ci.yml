name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install build pytest
          pip install -e .

      - name: Run tests
        run: pytest -q

      - name: Self-check on the broken example (must fail)
        run: |
          cd examples/broken_pkg
          python -m build --wheel
          if releasesmoke dist/*.whl; then
            echo "::error::releasesmoke passed a wheel that is missing a subpackage"
            exit 1
          fi
          echo "Correctly rejected the broken wheel."
