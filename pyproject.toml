[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "releasesmoke"
version = "0.1.0"
description = "Pre-release smoke tests for Python packages"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sathyadev" }]
keywords = ["packaging", "wheel", "release", "ci", "smoke-test"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/sathyadev-ui/releasesmoke"
Issues = "https://github.com/sathyadev-ui/releasesmoke/issues"

[project.scripts]
releasesmoke = "releasesmoke.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
